<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <!-- IBM Plex Sans KR + JetBrains Mono: Google Fonts의 unicode-range 분할본 — 필요한 글자 조각만 받고 font-display: swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 렌더링을 막지 않도록 print 미디어로 받은 뒤 적용합니다(첫 페인트는 시스템 폰트, 도착하면 swap). -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript
      ><link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap"
    /></noscript>
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0b" />
    <meta name="description" content="키보드 서퍼 채종원의 Portfolio 입니다." />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!-- Open Graph / Twitter: Kakao, Facebook, etc. use these for link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="FE 개발자 채종원입니다." />
    <meta property="og:description" content="키보드 서퍼 채종원의 Portfolio 입니다." />
    <meta property="og:url" content="https://jone4865-portfolio.vercel.app/" />
    <!-- 절대경로 이미지 (배포된 정적 자원). 빌드 해시가 바뀌면 이 경로도 업데이트 필요 -->
    <meta
      property="og:image"
      content="https://jone4865-portfolio.vercel.app/static/media/profile.b66f79a4cb01cd09a9a2.png"
    />
    <meta property="og:image:width" content="800" />
    <meta property="og:image:height" content="800" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FE 개발자 채종원입니다." />
    <meta name="twitter:description" content="키보드 서퍼 채종원의 Portfolio 입니다." />
    <meta
      name="twitter:image"
      content="https://jone4865-portfolio.vercel.app/static/media/profile.b66f79a4cb01cd09a9a2.png"
    />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>FE 개발자 채종원입니다.</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
